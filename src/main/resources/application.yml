spring:
  application:
    name: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool-UrlShortener
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 120000
      max-lifetime: 300000
      connection-timeout: 30000
      auto-commit: true
      keepalive-time: 60000
      connection-test-query: SELECT 1
      # Important for Supabase pooler connections
      data-source-properties:
        socketTimeout: 30
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false
otel:
  instrumentation:
    http:
      # This is the most reliable way to kill Actuator traces in the OTel Starter
      server:
        filter:
          additional-patterns: "/actuator/**"
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:10000}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  metric:
    export:
      interval: ${OTEL_METRIC_EXPORT_INTERVAL:60000}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:0.0}
  sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,configprops,env"
  endpoint:
    prometheus:
      access: read_only
